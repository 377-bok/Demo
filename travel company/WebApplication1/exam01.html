<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Mercedes-Benz 配備客製化</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .option-card {
      border: 2px solid transparent;
      border-radius: 10px;
      transition: 0.3s;
      cursor: pointer;
    }
    .option-card:hover { border-color: #999; }
    .option-card.selected {
      border-color: #007bff;
      box-shadow: 0 0 8px rgba(0,123,255,0.6);
    }
    .option-img {
      width: 100%;
      border-radius: 10px 10px 0 0;
      object-fit: cover;
      height: 140px;
    }
  </style>
</head>
<body>
<div class="container my-4">
  <h2 class="text-center mb-4">🚘 Mercedes-Benz 車款與配備選擇</h2>

  <!-- 車款選擇 -->
  <div class="mb-4">
    <label class="form-label">選擇車款：</label>
    <select id="model" class="form-select" onchange="updateBasePrice()">
      <option value="">請選擇車款</option>
      <option value="A200">A200 Sedan - 1,800,000 元</option>
      <option value="C300">C300 Sedan - 2,600,000 元</option>
      <option value="GLC300">GLC300 SUV - 3,200,000 元</option>
    </select>
  </div>

  <!-- 配備選項 -->
  <h5>🔧 選擇配備 (可多選)：</h5>
  <div class="row g-3 mt-2" id="optionsContainer"></div>

  <!-- 總價 -->
  <div class="mt-4 text-center">
    <h4>💰 總價：<span id="totalPrice" class="text-danger fw-bold">0</span> 元</h4>
    <button class="btn btn-primary mt-3" onclick="submitOrder()">送出報價</button>
  </div>

  <div id="result" class="mt-4"></div>
</div>

<script>
const basePrices = {
  "A200": 1800000,
  "C300": 2600000,
  "GLC300": 3200000
};

const options = [
  {id:"pkg1", name:"全景天窗", price:50000, img:"https://cdn.pixabay.com/photo/2016/11/29/09/32/sunroof-1868999_1280.jpg"},
  {id:"pkg2", name:"高級音響", price:80000, img:"https://cdn.pixabay.com/photo/2016/11/23/15/59/audio-1851511_1280.jpg"},
  {id:"pkg3", name:"真皮內裝", price:40000, img:"https://cdn.pixabay.com/photo/2016/01/19/15/05/car-interior-1149967_1280.jpg"},
  {id:"pkg4", name:"智慧駕駛輔助", price:30000, img:"https://cdn.pixabay.com/photo/2016/11/22/23/45/steering-wheel-1851248_1280.jpg"}
];

let selectedOptions = [];

window.onload = function() {
  const container = document.getElementById("optionsContainer");
  options.forEach(opt => {
    const card = document.createElement("div");
    card.className = "col-md-3";
    card.innerHTML = `
      <div class="card option-card" id="${opt.id}" onclick="toggleOption('${opt.id}')">
        <img src="${opt.img}" class="option-img" alt="${opt.name}">
        <div class="card-body text-center">
          <h6 class="card-title">${opt.name}</h6>
          <p class="text-muted">+${opt.price.toLocaleString()} 元</p>
        </div>
      </div>`;
    container.appendChild(card);
  });
};

function toggleOption(id) {
  const index = selectedOptions.indexOf(id);
  const card = document.getElementById(id);
  if (index === -1) {
    selectedOptions.push(id);
    card.classList.add("selected");
  } else {
    selectedOptions.splice(index, 1);
    card.classList.remove("selected");
  }
  updatePrice();
}

function updateBasePrice() { updatePrice(); }

function updatePrice() {
  const model = document.getElementById("model").value;
  const base = basePrices[model] || 0;
  const addons = selectedOptions
    .map(id => options.find(o => o.id === id).price)
    .reduce((a,b)=>a+b,0);
  document.getElementById("totalPrice").innerText = (base + addons).toLocaleString();
}

function submitOrder() {
  const model = document.getElementById("model").value;
  if (!model) { alert("請先選擇車款！"); return; }
  const total = document.getElementById("totalPrice").innerText;
  const selected = selectedOptions.map(id => options.find(o => o.id === id).name).join("、") || "無";

  document.getElementById("result").innerHTML = `
    <div class="alert alert-success">
      ✅ 您選擇的車款：${model}<br>
      🔧 配備：${selected}<br>
      💰 總價：<strong>${total} 元</strong>
    </div>`;
}
</script>
</body>
</html>
