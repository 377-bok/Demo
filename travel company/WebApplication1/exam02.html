<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>Mercedes-Benz 購車報價系統</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-4 mb-5">
  <h2 class="text-center mb-4">🚘 Mercedes-Benz 購車報價系統</h2>
  
  <form id="carForm" class="card p-4 shadow">
    <!-- 地區選擇 -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">縣市：</label>
        <select id="city" class="form-select" onchange="loadDealers()">
          <option value="">請選擇縣市</option>
          <option value="台北">台北</option>
          <option value="台中">台中</option>
          <option value="高雄">高雄</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">經銷商：</label>
        <select id="dealer" class="form-select">
          <option value="">請先選擇縣市</option>
        </select>
      </div>
    </div>

    <!-- 車款選擇 -->
    <div class="row mb-3">
      <div class="col-md-6">
        <label class="form-label">車款：</label>
        <select id="model" class="form-select" onchange="updatePrice()">
          <option value="">請選擇車款</option>
          <option value="A200">A200 Sedan - 1,800,000 元</option>
          <option value="C300">C300 Sedan - 2,600,000 元</option>
          <option value="GLC300">GLC300 SUV - 3,200,000 元</option>
          <option value="E300">E300 Sedan - 3,500,000 元</option>
        </select>
      </div>
      <div class="col-md-6">
        <label class="form-label">車款價格 (元)：</label>
        <input type="text" id="price" class="form-control" readonly>
      </div>
    </div>

    <!-- 配件選擇 -->
    <div class="mb-3">
      <label class="form-label">選擇配件：</label><br>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" value="50000" id="pkg1" onchange="updatePrice()">
        <label class="form-check-label" for="pkg1">全景天窗 (+50,000)</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" value="80000" id="pkg2" onchange="updatePrice()">
        <label class="form-check-label" for="pkg2">高級音響 (+80,000)</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" value="40000" id="pkg3" onchange="updatePrice()">
        <label class="form-check-label" for="pkg3">真皮內裝 (+40,000)</label>
      </div>
      <div class="form-check form-check-inline">
        <input class="form-check-input" type="checkbox" value="30000" id="pkg4" onchange="updatePrice()">
        <label class="form-check-label" for="pkg4">智慧駕駛輔助 (+30,000)</label>
      </div>
    </div>

    <!-- 總價 -->
    <div class="mt-3">
      <label class="form-label">總價 (元)：</label>
      <input type="text" id="totalPrice" class="form-control text-danger fw-bold" readonly>
    </div>

    <!-- 使用者資料 -->
    <div class="row mt-4">
      <div class="col-md-6">
        <label class="form-label">姓名：</label>
        <input type="text" id="name" class="form-control" placeholder="輸入姓名">
      </div>
      <div class="col-md-6">
        <label class="form-label">Email：</label>
        <input type="email" id="email" class="form-control" placeholder="輸入Email">
      </div>
    </div>

    <div class="text-center mt-4">
      <button type="button" class="btn btn-primary btn-lg" onclick="submitForm()">送出報價</button>
    </div>
  </form>

  <div id="result" class="mt-4"></div>
</div>

<script>
// 各地經銷商資料
const dealers = {
  "台北": ["中山賓士", "信義賓士", "內湖賓士"],
  "台中": ["西屯賓士", "北區賓士"],
  "高雄": ["鳳山賓士", "左營賓士"]
};

// 各車款對應價格
const carPrices = {
  "A200": 1800000,
  "C300": 2600000,
  "GLC300": 3200000,
  "E300": 3500000
};

// 載入經銷商
function loadDealers() {
  const city = document.getElementById("city").value;
  const dealerSelect = document.getElementById("dealer");
  dealerSelect.innerHTML = "<option value=''>請選擇經銷商</option>";
  if (city && dealers[city]) {
    dealers[city].forEach(d => {
      dealerSelect.innerHTML += `<option value="${d}">${d}</option>`;
    });
  }
}

// 更新價格計算
function updatePrice() {
  const model = document.getElementById("model").value;
  let basePrice = carPrices[model] || 0;

  document.getElementById("price").value = basePrice.toLocaleString();

  let accessories = 0;
  document.querySelectorAll("input[type=checkbox]:checked").forEach(item => {
    accessories += parseInt(item.value);
  });

  const total = basePrice + accessories;
  document.getElementById("totalPrice").value = total.toLocaleString();
}

// 送出表單
function submitForm() {
  const name = document.getElementById("name").value;
  const email = document.getElementById("email").value;
  const city = document.getElementById("city").value;
  const dealer = document.getElementById("dealer").value;
  const model = document.getElementById("model").value;
  const total = document.getElementById("totalPrice").value;

  if (!name || !email || !city || !dealer || !model) {
    alert("⚠️ 請完整填寫所有欄位！");
    return;
  }

  document.getElementById("result").innerHTML = `
    <div class="alert alert-success">
      <h5>感謝 ${name} 的填寫！</h5>
      <p>地區：${city}<br>
      經銷商：${dealer}<br>
      選擇車款：${model}<br>
      總報價：<strong>${total} 元</strong><br>
      我們將透過 Email (${email}) 與您聯絡！</p>
    </div>`;
}
</script>
</body>
</html>
